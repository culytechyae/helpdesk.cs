{% extends "base.html" %}
{% block title %}401 – Unauthorized – {{ system_settings.system_name }}{% endblock %}
{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height:60vh;">
    <div class="text-center">
        <div style="font-size:6rem;font-weight:900;background:linear-gradient(135deg,#6c757d,#495057);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;">401</div>
        <h2 class="mt-2 mb-3 fw-bold text-white">Unauthorized</h2>
        <p class="text-white-50 mb-4">You need to be logged in to access this page.</p>
        <div class="d-flex gap-3 justify-content-center flex-wrap">
            <a href="{{ url_for('login') }}" class="btn btn-primary btn-lg px-4">
                <i class="fas fa-sign-in-alt me-2"></i>Log In
            </a>
            <a href="{{ url_for('index') }}" class="btn btn-secondary btn-lg px-4">
                <i class="fas fa-home me-2"></i>Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
