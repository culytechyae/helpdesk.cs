{% extends "base.html" %}
{% block title %}Backup Complete – {{ system_settings.system_name }}{% endblock %}
{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height:60vh;">
    <div class="text-center">
        <div style="width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,#28a745,#20c997);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;box-shadow:0 8px 24px rgba(40,167,69,0.4);">
            <i class="fas fa-check fa-2x text-white"></i>
        </div>
        <h2 class="fw-bold text-white mb-2">Backup Successful</h2>
        <p class="text-white-50 mb-4">The database backup has been completed successfully.</p>
        <div class="d-flex gap-3 justify-content-center flex-wrap">
            <a href="{{ url_for('admin_database_management') }}" class="btn btn-primary btn-lg px-4">
                <i class="fas fa-database me-2"></i>Database Management
            </a>
            <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary btn-lg px-4">
                <i class="fas fa-tachometer-alt me-2"></i>Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
