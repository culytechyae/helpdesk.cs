{% extends "base.html" %}
{% block title %}404 – Page Not Found – {{ system_settings.system_name }}{% endblock %}
{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height:60vh;">
    <div class="text-center">
        <div style="font-size:6rem;font-weight:900;background:linear-gradient(135deg,#2c5f5f,#6bc4c4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;">404</div>
        <h2 class="mt-2 mb-3 fw-bold text-white">Page Not Found</h2>
        <p class="text-white-50 mb-4">The page you're looking for doesn't exist or has been moved.</p>
        <div class="d-flex gap-3 justify-content-center flex-wrap">
            <a href="{{ url_for('dashboard') }}" class="btn btn-primary btn-lg px-4">
                <i class="fas fa-tachometer-alt me-2"></i>Go to Dashboard
            </a>
            <a href="javascript:history.back()" class="btn btn-secondary btn-lg px-4">
                <i class="fas fa-arrow-left me-2"></i>Go Back
            </a>
        </div>
    </div>
</div>
{% endblock %}
